resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream employees_pool {
    zone employees_pool 64k;
    server employees-backend:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
upstream reports_pool {
    zone reports_pool 64k;
    server reports-backend:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
upstream files_pool {
    zone files_pool 64k;
    server files-backend:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_connect_timeout 1s;
proxy_read_timeout 15s;
# Even GET /reports/employees-report creates a file, so retries could duplicate work.
proxy_next_upstream off;

server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name employees-service;
    location = /metrics { return 404; }
    location / { proxy_pass http://employees_pool; }
}
server {
    listen 80;
    server_name reports-service;
    location = /metrics { return 404; }
    location / { proxy_pass http://reports_pool; }
}
server {
    listen 80;
    server_name files-service;
    location = /metrics { return 404; }
    location / { proxy_pass http://files_pool; }
}

# A separate listener keeps internal routes unavailable through a forged Host header.
server {
    listen 8080 default_server;
    absolute_redirect off;
    location = /employees/metrics { return 404; }
    location /employees/ { proxy_pass http://employees_pool/; }
    location = /employees/swagger/ { return 302 /employees/swagger/index.html; }
    location /employees/swagger/ {
        proxy_pass http://employees_pool/swagger/;
        proxy_set_header Accept-Encoding "";
        sub_filter '\/swagger\/doc.json' '\/employees\/swagger\/doc.json';
    }
}
