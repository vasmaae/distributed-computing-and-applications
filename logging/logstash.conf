input {
  beats { port => 5044 }
}

filter {
  json { source => "message" }
  if "_jsonparsefailure" in [tags] {
    # Keep unexpected runtime output searchable rather than silently losing it.
    mutate {
      rename => { "source_service" => "service" }
      add_field => { "level" => "ERROR" }
    }
  } else {
    date { match => ["time", "ISO8601"] }
    mutate { rename => { "msg" => "message" } }
  }
  mutate { remove_field => ["time", "source_service", "agent", "ecs", "host", "input", "event"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+yyyy.MM.dd}"
    manage_template => false
    ilm_enabled => false
  }
}
