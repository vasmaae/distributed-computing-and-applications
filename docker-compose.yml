services:
  employees-service:
    build:
      context: ./employees
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - employees/.env

    depends_on:
      postgres:
        condition: service_healthy


  reports-service:
    build:
      context: ./reports
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - reports/.env

    depends_on:
      - files-service


  files-service:
    build:
      context: ./files
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - files/.env

    depends_on:
      seaweedfs:
        condition: service_healthy


  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - database/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 15


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - employees-service
      - reports-service
      - postgres
      - seaweedfs


  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: [ "mini", "-dir=data" ]
    restart: unless-stopped

    env_file:
      - storage/.env

    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  seaweedfs_data:
