services:
  employees-service:
    build:
      context: .
      dockerfile: employees/Dockerfile

    restart: unless-stopped

    env_file:
      - employees/.env

    depends_on:
      postgres:
        condition: service_healthy


  reports-service:
    build:
      context: .
      dockerfile: reports/Dockerfile

    restart: unless-stopped

    env_file:
      - reports/.env

    depends_on:
      kafka-init:
        condition: service_completed_successfully


  files-service:
    build:
      context: .
      dockerfile: files/Dockerfile

    restart: unless-stopped

    env_file:
      - files/.env

    depends_on:
      seaweedfs:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully


  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - database/.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 15


  nginx:
    image: nginx:alpine

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - employees-service
      - reports-service
      - postgres
      - seaweedfs


  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: [ "mini", "-dir=data" ]
    restart: unless-stopped

    env_file:
      - storage/.env

    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    # shortcut: one broker for the local lab; use replicas when availability is required.
    image: apache/kafka:4.1.0
    restart: unless-stopped
    env_file:
      - queue/.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    env_file:
      - queue/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${QUEUE_TOPIC}" --partitions 1 --replication-factor 1 --config max.message.bytes=9437184'
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    env_file:
      - kafka-ui/.env
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  jaeger:
    # shortcut: traces are in memory; add persistent storage when history must survive restarts.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - employees-service
      - reports-service
      - files-service

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    env_file:
      - monitoring/.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  seaweedfs_data:
  kafka_data:
  prometheus_data:
  grafana_data:
