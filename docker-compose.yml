services:
  employees-service:
    build:
      context: ./employees
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - employees/.env

    depends_on:
      postgres:
        condition: service_healthy


  reports-service:
    build:
      context: ./reports
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - reports/.env

    depends_on:
      kafka-init:
        condition: service_completed_successfully


  files-service:
    build:
      context: ./files
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - files/.env

    depends_on:
      seaweedfs:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully


  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - database/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 15


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - employees-service
      - reports-service
      - postgres
      - seaweedfs


  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: [ "mini", "-dir=data" ]
    restart: unless-stopped

    env_file:
      - storage/.env

    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    env_file:
      - queue/.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    env_file:
      - queue/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${QUEUE_TOPIC}" --partitions 1 --replication-factor 1 --config max.message.bytes=9437184'
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
  kafka_data:
