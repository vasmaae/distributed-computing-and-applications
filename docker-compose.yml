x-app: &app
  restart: unless-stopped
  labels:
    distributed.logs: "json"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
    interval: 2s
    timeout: 3s
    retries: 30

x-employees-instance: &employees-instance
  <<: *app
  build:
    context: .
    dockerfile: employees/Dockerfile
  env_file: [employees/.env]
  networks:
    default:
      aliases: [employees-backend]
  depends_on:
    postgres:
      condition: service_healthy

x-reports-instance: &reports-instance
  <<: *app
  build:
    context: .
    dockerfile: reports/Dockerfile
  env_file: [reports/.env]
  networks:
    default:
      aliases: [reports-backend]
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-files-instance: &files-instance
  <<: *app
  build:
    context: .
    dockerfile: files/Dockerfile
  env_file: [files/.env]
  networks:
    default:
      aliases: [files-backend]
  depends_on:
    seaweedfs:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-kafka: &kafka
  image: apache/kafka:4.1.0
  restart: unless-stopped
  mem_limit: 1g
  env_file: [queue/.env]
  entrypoint: ["/bin/bash", "/scripts/start.sh"]
  healthcheck:
    test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
    interval: 5s
    timeout: 10s
    retries: 30

services:
  employees-1: *employees-instance
  employees-2: *employees-instance
  reports-1: *reports-instance
  reports-2: *reports-instance
  files-1: *files-instance
  files-2: *files-instance

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    env_file:
      - database/.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 15


  nginx:
    image: nginx:1.31.6-alpine

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      default:
        aliases: [employees-service, reports-service, files-service]
    depends_on:
      employees-1:
        condition: service_healthy
      employees-2:
        condition: service_healthy
      reports-1:
        condition: service_healthy
      reports-2:
        condition: service_healthy
      files-1:
        condition: service_healthy
      files-2:
        condition: service_healthy


  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: [ "mini", "-dir=data" ]
    restart: unless-stopped

    env_file:
      - storage/.env

    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka-1:
    <<: *kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    networks:
      default:
        aliases: [kafka]
    volumes:
      - ./queue:/scripts:ro
      - kafka_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - ./queue:/scripts:ro
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - ./queue:/scripts:ro
      - kafka_3_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.0
    env_file: [queue/.env]
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    volumes:
      - ./queue:/scripts:ro
      - kafka_2_data:/nodes/2:ro
      - kafka_3_data:/nodes/3:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    env_file:
      - kafka-ui/.env
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  jaeger:
    # shortcut: traces are in memory; add persistent storage when history must survive restarts.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - employees-1
      - reports-1
      - files-1

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    env_file:
      - monitoring/.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  elasticsearch:
    # shortcut: local single-node ELK without TLS/auth; enable security before allowing remote access.
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 5s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    mem_limit: 2g
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
    volumes:
      - ./logging/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 10s
      retries: 30

  logging-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    entrypoint: ["/bin/bash", "/setup/setup.sh"]
    volumes:
      - ./logging/setup:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    restart: unless-stopped
    mem_limit: 768m
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m"
      LOG_FORMAT: json
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_WORKERS: "1"
      PIPELINE_ECS_COMPATIBILITY: disabled
      QUEUE_TYPE: persisted
      QUEUE_MAX_BYTES: 256mb
      QUEUE_CHECKPOINT_WRITES: "1"
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      logging-setup:
        condition: service_completed_successfully

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.5
    user: root
    restart: unless-stopped
    mem_limit: 256m
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash

volumes:
  postgres_data:
  seaweedfs_data:
  kafka_data:
  kafka_2_data:
  kafka_3_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  logstash_data:
  filebeat_data:
