global:
  scrape_interval: 5s

scrape_configs:
  - job_name: employees
    dns_sd_configs:
      - names: [employees-backend]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: reports
    dns_sd_configs:
      - names: [reports-backend]
        type: A
        port: 8080
        refresh_interval: 5s
  - job_name: files
    dns_sd_configs:
      - names: [files-backend]
        type: A
        port: 8080
        refresh_interval: 5s
